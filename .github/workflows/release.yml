name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + annotated tag messages for prerelease detection.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Read version from tag / file
        id: version
        shell: pwsh
        run: |
          $fromFile = (& python scripts/get_version.py).Trim()
          $fromTag = $env:GITHUB_REF_NAME
          if ($fromTag.StartsWith("v")) { $fromTag = $fromTag.Substring(1) }
          if ($fromTag -ne $fromFile) {
            Write-Error "Tag version '$fromTag' does not match version file '$fromFile'"
            exit 1
          }

          # Prefer annotated tag message; fall back to tagged commit message.
          # Shallow checkouts / missing tag objects used to yield an empty message
          # and silently ship as latest instead of prerelease.
          git fetch origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}" --force 2>$null
          $tagMessage = (git tag -l --format="%(contents)" $env:GITHUB_REF_NAME 2>$null | Out-String).Trim()
          if (-not $tagMessage) {
            $tagMessage = (git log -1 --pretty=%B $env:GITHUB_REF_NAME 2>$null | Out-String).Trim()
          }
          $isPrerelease = $tagMessage -match "(?i)\(prerelease\)"
          Write-Host "Tag message: $tagMessage"
          Write-Host "Prerelease: $isPrerelease"

          "version=$fromFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$fromFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build PyInstaller app
        shell: pwsh
        run: .\scripts\build.ps1 -Clean

      - name: Build update zip
        shell: pwsh
        run: .\scripts\build-zip.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }

      - name: Build first-install installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/Ashen-Macros-${{ steps.version.outputs.version }}.zip
            dist/Ashen.Macro.installer.exe

  build-linux:
    # Oldest supported Ubuntu keeps the glibc requirement low; runs on newer distros too.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check tag matches version file
        id: version
        run: |
          from_file="$(python scripts/get_version.py | tr -d '[:space:]')"
          from_tag="${GITHUB_REF_NAME#v}"
          if [ "$from_tag" != "$from_file" ]; then
            echo "::error::Tag version '$from_tag' does not match version file '$from_file'"
            exit 1
          fi
          echo "version=$from_file" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: python -m unittest scripts.test_versioning scripts.test_linux_support

      - name: Build PyInstaller app and tarball
        run: python scripts/build.py --clean --version "${{ steps.version.outputs.version }}"

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: dist/Ashen-Macros-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: ${{ needs.build-windows.outputs.version }}
          prerelease: ${{ needs.build-windows.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build-windows.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          files: |
            assets/Ashen-Macros-${{ needs.build-windows.outputs.version }}.zip
            assets/Ashen.Macro.installer.exe
            assets/Ashen-Macros-${{ needs.build-windows.outputs.version }}-linux-x86_64.tar.gz
